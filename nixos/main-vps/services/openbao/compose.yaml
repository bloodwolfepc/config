services:
  openbao:
    image: docker.io/openbao/openbao:2.6.0@sha256:900bb64d0671cd1d82b693c56206f7263b582445f3a3bb6ba6e5213f524a6653
    user: "0"
    restart: "no"
    environment:
      BAO_SKIP_DROP_ROOT: "true"
    command: server -config=/bao/config/openbao.hcl
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - /srv/dr/openbao/data:/openbao/file
      - ./openbao.hcl:/bao/config/openbao.hcl:ro
