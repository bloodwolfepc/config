monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-BEHRINGER_UMC404HD_192k-00.*" }
      { node.name = "~alsa_output.usb-BEHRINGER_UMC404HD_192k-00.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 64
        api.alsa.period-num = 3
        api.alsa.headroom = 0
      }
    }
  }
]

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-BEHRINGER_UMC404HD_192k-00" }
    ]
    actions = {
      update-props = {
        priorities = [ "pro-audio" ]
      }
    }
  }
]
