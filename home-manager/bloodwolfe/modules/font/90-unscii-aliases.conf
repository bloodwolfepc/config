<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Give every Unscii OTF face a stable family name instead of treating
       bitmap sizes and designs as styles of one ambiguous family. -->
  <match target="scan">
    <test name="fullname" compare="eq"><string>unscii-16-full</string></test>
    <edit name="family" mode="assign_replace"><string>unscii-16-full</string></edit>
  </match>
  <match target="scan">
    <test name="fullname" compare="eq"><string>unscii-16</string></test>
    <edit name="family" mode="assign_replace"><string>unscii-16</string></edit>
  </match>
  <match target="scan">
    <test name="fullname" compare="eq"><string>unscii-8</string></test>
    <edit name="family" mode="assign_replace"><string>unscii-8</string></edit>
  </match>
  <match target="scan">
    <test name="fullname" compare="eq"><string>unscii-8-alt</string></test>
    <edit name="family" mode="assign_replace"><string>unscii-8-alt</string></edit>
  </match>
  <match target="scan">
    <test name="fullname" compare="eq"><string>unscii-8-fantasy</string></test>
    <edit name="family" mode="assign_replace"><string>unscii-8-fantasy</string></edit>
  </match>
  <match target="scan">
    <test name="fullname" compare="eq"><string>unscii-8-mcr</string></test>
    <edit name="family" mode="assign_replace"><string>unscii-8-mcr</string></edit>
  </match>
  <match target="scan">
    <test name="fullname" compare="eq"><string>unscii-8-tall</string></test>
    <edit name="family" mode="assign_replace"><string>unscii-8-tall</string></edit>
  </match>
  <match target="scan">
    <test name="fullname" compare="eq"><string>unscii-8-thin</string></test>
    <edit name="family" mode="assign_replace"><string>unscii-8-thin</string></edit>
  </match>
</fontconfig>
