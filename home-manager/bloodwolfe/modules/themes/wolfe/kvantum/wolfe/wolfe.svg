<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!-- Wolfe Kvantum template: every shape is deliberately rectangular. -->
  <defs>
    <g id="black"><rect width="16" height="16" fill="#000000"/></g>
    <g id="surface"><rect width="16" height="16" fill="#080808" stroke="#303030"/></g>
    <g id="focus"><rect width="16" height="16" fill="#101010" stroke="#b000ff"/></g>
    <g id="active"><rect width="16" height="16" fill="#b000ff"/></g>
    <g id="muted"><rect width="16" height="16" fill="#181818"/></g>
    <g id="check"><rect width="16" height="16" fill="#b000ff"/><path d="M3 8l3 3 7-7" fill="none" stroke="#000" stroke-width="2"/></g>
    <g id="radio"><rect width="16" height="16" fill="#b000ff"/><rect x="5" y="5" width="6" height="6" fill="#000"/></g>
    <g id="arrow-down"><path d="M3 5h10L8 11z" fill="#fff"/></g>
    <g id="arrow-up"><path d="M3 11h10L8 5z" fill="#fff"/></g>
    <g id="arrow-left"><path d="M11 3v10L5 8z" fill="#fff"/></g>
    <g id="arrow-right"><path d="M5 3v10l6-5z" fill="#fff"/></g>
  </defs>

  <use id="window-normal" xlink:href="#black" x="0" y="0"/>
  <use id="common-normal" xlink:href="#surface" x="20" y="0"/>
  <use id="common-focused" xlink:href="#focus" x="40" y="0"/>
  <use id="button-normal" xlink:href="#surface" x="60" y="0"/>
  <use id="button-focused" xlink:href="#focus" x="80" y="0"/>
  <use id="button-pressed" xlink:href="#active" x="100" y="0"/>
  <use id="button-toggled" xlink:href="#active" x="120" y="0"/>
  <use id="tbutton-normal" xlink:href="#surface" x="140" y="0"/>
  <use id="tbutton-focused" xlink:href="#focus" x="160" y="0"/>
  <use id="tbutton-pressed" xlink:href="#active" x="180" y="0"/>
  <use id="tbutton-toggled" xlink:href="#active" x="200" y="0"/>

  <use id="lineedit-normal" xlink:href="#surface" x="0" y="20"/>
  <use id="lineedit-focused" xlink:href="#focus" x="20" y="20"/>
  <use id="menu-normal" xlink:href="#black" x="40" y="20"/>
  <use id="menuitem-normal" xlink:href="#black" x="60" y="20"/>
  <use id="menuitem-focused" xlink:href="#active" x="80" y="20"/>
  <use id="menuitem-pressed" xlink:href="#active" x="100" y="20"/>
  <use id="menuitem-toggled" xlink:href="#active" x="120" y="20"/>
  <use id="menubaritem-normal" xlink:href="#black" x="140" y="20"/>
  <use id="menubaritem-focused" xlink:href="#focus" x="160" y="20"/>
  <use id="toolbar-normal" xlink:href="#black" x="180" y="20"/>
  <use id="tooltip-normal" xlink:href="#surface" x="200" y="20"/>

  <use id="itemview-normal" xlink:href="#black" x="0" y="40"/>
  <use id="itemview-focused" xlink:href="#active" x="20" y="40"/>
  <use id="itemview-pressed" xlink:href="#active" x="40" y="40"/>
  <use id="itemview-toggled" xlink:href="#active" x="60" y="40"/>
  <use id="tab-normal" xlink:href="#surface" x="80" y="40"/>
  <use id="tab-focused" xlink:href="#focus" x="100" y="40"/>
  <use id="tab-pressed" xlink:href="#active" x="120" y="40"/>
  <use id="tab-toggled" xlink:href="#active" x="140" y="40"/>
  <use id="tabframe-normal" xlink:href="#black" x="160" y="40"/>

  <use id="checkbox-normal" xlink:href="#surface" x="0" y="60"/>
  <use id="checkbox-focused" xlink:href="#focus" x="20" y="60"/>
  <use id="checkbox-checked-normal" xlink:href="#check" x="40" y="60"/>
  <use id="checkbox-checked-focused" xlink:href="#check" x="60" y="60"/>
  <use id="checkbox-tristate-normal" xlink:href="#active" x="80" y="60"/>
  <use id="checkbox-tristate-focused" xlink:href="#active" x="100" y="60"/>
  <use id="radio-normal" xlink:href="#surface" x="120" y="60"/>
  <use id="radio-focused" xlink:href="#focus" x="140" y="60"/>
  <use id="radio-checked-normal" xlink:href="#radio" x="160" y="60"/>
  <use id="radio-checked-focused" xlink:href="#radio" x="180" y="60"/>

  <use id="progress-normal" xlink:href="#muted" x="0" y="80"/>
  <use id="progress-pattern-normal" xlink:href="#active" x="20" y="80"/>
  <use id="progress-pattern-disabled" xlink:href="#muted" x="40" y="80"/>
  <use id="scrollbargroove-normal" xlink:href="#black" x="60" y="80"/>
  <use id="scrollbarslider-normal" xlink:href="#muted" x="80" y="80"/>
  <use id="scrollbarslider-focused" xlink:href="#focus" x="100" y="80"/>
  <use id="scrollbarslider-pressed" xlink:href="#active" x="120" y="80"/>
  <use id="slider-normal" xlink:href="#muted" x="140" y="80"/>
  <use id="slider-focused" xlink:href="#focus" x="160" y="80"/>
  <use id="slidercursor-normal" xlink:href="#surface" x="180" y="80"/>
  <use id="slidercursor-focused" xlink:href="#focus" x="200" y="80"/>
  <use id="slidercursor-pressed" xlink:href="#active" x="220" y="80"/>

  <use id="splitter-normal" xlink:href="#muted" x="0" y="100"/>
  <use id="splitter-focused" xlink:href="#active" x="20" y="100"/>
  <use id="group-normal" xlink:href="#black" x="40" y="100"/>
  <use id="titlebar-normal" xlink:href="#black" x="60" y="100"/>

  <use id="arrow-down-normal" xlink:href="#arrow-down" x="0" y="120"/>
  <use id="arrow-down-pressed" xlink:href="#arrow-down" x="20" y="120"/>
  <use id="arrow-up-normal" xlink:href="#arrow-up" x="40" y="120"/>
  <use id="arrow-up-pressed" xlink:href="#arrow-up" x="60" y="120"/>
  <use id="arrow-left-normal" xlink:href="#arrow-left" x="80" y="120"/>
  <use id="arrow-left-pressed" xlink:href="#arrow-left" x="100" y="120"/>
  <use id="arrow-right-normal" xlink:href="#arrow-right" x="120" y="120"/>
  <use id="arrow-right-pressed" xlink:href="#arrow-right" x="140" y="120"/>
</svg>
