[calendars]
[[bloodwolfe]]
path = /persist/home/bloodwolfe/.cal/bloodwolfe/*
priority = 10
type = discover

[[bloodwolfe-rainbow]]
path = /persist/home/bloodwolfe/.cont/bloodwolfe/rainbow
priority = 10
type = birthdays

[[bloodwolfe-waterfall]]
path = /persist/home/bloodwolfe/.cont/bloodwolfe/waterfall
priority = 10
type = birthdays

[default]
default_calendar = waterfall
highlight_event_days = true

[locale]
dateformat = %x
datetimeformat = %c
firstweekday = 0
longdateformat = %x
longdatetimeformat = %c
timeformat = %H:%M
unicode_symbols = true
weeknumbers = off
