[general]
status_path = "/home/bloodwolfe/.local/share/vdirsyncer/status"

[pair calendar_bloodwolfe]
a = "calendar_bloodwolfe_remote"
b = "calendar_bloodwolfe_local"
collections = ["waterfall", "rainbow"]
conflict_resolution = "a wins"
metadata = ["color", "displayname"]

[pair contacts_bloodwolfe]
a = "contacts_bloodwolfe_remote"
b = "contacts_bloodwolfe_local"
collections = ["waterfall", "rainbow"]
conflict_resolution = "a wins"

[storage calendar_bloodwolfe_local]
fileext = ".ics"
path = "/persist/home/bloodwolfe/.cal/bloodwolfe"
type = "filesystem"

[storage contacts_bloodwolfe_local]
fileext = ".vcf"
path = "/persist/home/bloodwolfe/.cont/bloodwolfe"
type = "filesystem"

[storage calendar_bloodwolfe_remote]
password.fetch = ["command", "cat", "/home/bloodwolfe/.config/sops-nix/secrets/cloud-tinywolfe-net-password"]
type = "caldav"
url = "https://cloud.tinywolfe.net/remote.php/dav/"
username.fetch = ["command", "cat", "/home/bloodwolfe/.config/sops-nix/secrets/cloud-tinywolfe-net-username"]

[storage contacts_bloodwolfe_remote]
password.fetch = ["command", "cat", "/home/bloodwolfe/.config/sops-nix/secrets/cloud-tinywolfe-net-password"]
type = "carddav"
url = "https://cloud.tinywolfe.net/remote.php/dav/"
username.fetch = ["command", "cat", "/home/bloodwolfe/.config/sops-nix/secrets/cloud-tinywolfe-net-username"]
